<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 340px; font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 14px; margin: 0; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; background: #4f46e5; font-size: 11px; font-weight: 700; margin-bottom: 8px; }
    .url-box { background: #1e293b; padding: 8px; border-radius: 6px; font-family: monospace; font-size: 11px; word-break: break-all; color: #34d399; margin-bottom: 10px; border: 1px solid #334155; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; margin-bottom: 8px; font-size: 12px; }
    button { width: 100%; padding: 9px; background: #4f46e5; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div id="sourceBadge" class="badge">Forrás elemzése...</div>
  <div id="cleanUrl" class="url-box">...</div>
  <input id="titleInput" placeholder="Könyvjelző címe" />
  <input id="tagsInput" placeholder="Címkék (vesszővel elválasztva)" />
  <button id="saveBtn">Mentés és tiszta URL másolása</button>
  <script src="popup.js"></script>
</body>
</html>
